<!DOCTYPE html>
<html lang="">

<head>
  <meta charset="utf-8">
  <title>WGL</title>
  <style>
    html,
    body {
      display: flex;
      align-content: space-between;
      flex-direction: column;

      height: 100%;
      min-height: 100vh;
      margin: 0;
      padding: 0;
      font-family: arial;
      font-size: 14px;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: row;
      height: 15%;
      background-color: #111111;
      color: #dddddd;
      border-bottom: 3px solid gray;
      box-shadow: black 0px 0px 150px;
      z-index: 1000;
    }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;

      height: 100%;
      background-color: #444444;
      color: #dddddd;
      z-index: 999;
    }

    footer {
      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: row;
      height: 10%;
      background-color: #111111;
      color: #dddddd;
      border-top: 3px solid gray;
      box-shadow: #000000 0px 0px 150px;
      z-index: 1000;
    }

    #gl {
      border: 3px solid gray;
      border-radius: 25px;
      box-shadow: #222222 0px 0px 100px;
    }

    #webgl-logo {
      width: 80%;
      height: 80%;
    }

    #scoreBoard {
      font-size: 8px;
      text-align: center;
    }
  </style>
</head>

<body>
  <header>
    <img src="./assets/webgl-logo.svg" id="webgl-logo">
  </header>

  <main>
    <div id="scoreBoard">
      <h1>CTRL + R para reiniciar posições.<br> X para aumentar velocidade.</h1>
      <h1 id="gameStatus">Rodando</h1>
      <h1 id="gamePoints">0pt</h1>
    </div>
    <canvas id="gl" width="800" height="600"></canvas>
  </main>

  <footer>
    <iframe src="https://free.timeanddate.com/clock/ialzn0hw/n444/tlbr5/tt0" frameborder="0" width="318"
      height="18"></iframe>
  </footer>

  <script type="module" src="./js/Main.js"></script>
</body>

</html>
